name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_decompress
          - fuzz_inflate_diff
          - fuzz_roundtrip
          - fuzz_api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          cache-directories: fuzz/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Determine duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          find fuzz/regression -type f ! -name '*.md' ! -name '*.txt' \
            -exec cp '{}' fuzz/corpus/${{ matrix.target }}/ \;
          if [ -d fuzz/seed_corpus/${{ matrix.target }} ]; then
            cp -R fuzz/seed_corpus/${{ matrix.target }}/. fuzz/corpus/${{ matrix.target }}/
          fi
          if [ '${{ matrix.target }}' = fuzz_inflate_diff ]; then
            # Two source/capacity selectors, then an empty fixed-Huffman stream.
            printf '\000\000\003\000' > fuzz/corpus/fuzz_inflate_diff/empty-fixed
          fi

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=${{ steps.duration.outputs.seconds }} \
               -dict=fuzz/deflate.dict \
               -rss_limit_mb=2048

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30

  regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # Hard gate. Until 2026-08-29 this step read:
      #
      #   if [ -d fuzz/regression ] && [ "$(ls fuzz/regression/ | wc -l)" -gt 0 ]; then
      #     cargo test --test fuzz_regression 2>/dev/null || echo "No regression test found..."
      #   fi
      #
      # which could not fail: `|| echo` swallowed the exit status of a genuinely
      # failing suite, `2>/dev/null` hid the reason, and the `if` skipped the whole
      # thing when the corpus went missing. Worse here than elsewhere: the `ls`
      # count matched on README.md alone, so the branch was entered and the suite
      # ran over zero seeds, reporting green either way. tests/fuzz_regression.rs
      # has existed the whole time, so the "no test harness" fallback was never
      # the real case. Do not reintroduce a fallback: if the suite cannot run, go red.
      #
      # tests/fuzz_regression.rs pins the committed seed count and checks that
      # the corpus exists before replaying it through the target entry points.
      - name: Regression seeds
        run: cargo test --test fuzz_regression
