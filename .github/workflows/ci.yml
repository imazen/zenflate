name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # `github.head_ref` is set ONLY on pull_request events. On a push it is
  # empty, so the group fell through to `github.run_id` — unique per run,
  # so pushes never collided and nothing was ever cancelled. `github.ref`
  # is set on both event types (`refs/heads/main` on push,
  # `refs/pull/N/merge` on a PR), so PR behaviour is unchanged while
  # consecutive pushes to a branch now supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Full cross-API conformance matrix (tests/conformance.rs, release build)
  # ==========================================================================
  conformance:
    name: Conformance (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Same command as `just conformance-full`.
      - name: Full conformance matrix
        run: ZENFLATE_CONFORMANCE=full cargo test --release --test conformance

  # ==========================================================================
  # Native testing (5-platform matrix)
  # ==========================================================================
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux aarch64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: windows-11-arm, name: Windows arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test

      - name: Optional inventory scanner and regressions
        run: cargo test --features scan --test scan --test fuzz_regression

      - name: Test (decode-only, no simd)
        run: cargo test --lib --no-default-features --features std

      - name: Test (no simd, compress on scalar checksums)
        run: cargo test --lib --no-default-features --features compress,std,threads

      - name: Test (with unchecked bounds elimination)
        run: cargo test --features unchecked

      - name: Check feature combos (no_std / decode-only / no-simd)
        shell: bash
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features alloc
          cargo check --no-default-features --features compress
          cargo check --no-default-features --features compress,unchecked
          cargo check --no-default-features --features compress,simd
          cargo check --no-default-features --features simd,avx512,std
          cargo check --no-default-features --features std,unchecked

  # ==========================================================================
  # Cross-compiled 32-bit testing (i686 via QEMU)
  # ==========================================================================
  test-i686:
    name: Test i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Fetch scanner corpus for cross container
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/imazen/codec-corpus .ci-corpus
          git -C .ci-corpus sparse-checkout set pngsuite png-conformance
          echo "ZENFLATE_SCAN_CORPUS=.ci-corpus" >> "$GITHUB_ENV"

      - name: Test (i686/QEMU)
        run: cross test --target i686-unknown-linux-gnu

      - name: Optional scanner (i686/QEMU)
        run: cross test --features scan --target i686-unknown-linux-gnu --test scan --test fuzz_regression

  # ==========================================================================
  # WASM check
  # ==========================================================================
  wasm:
    name: WASM (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check WASM (no_std)
        run: cargo check --target wasm32-wasip1 --no-default-features

      - name: Check WASM scanner (no_std, no alloc)
        run: cargo check --target wasm32-wasip1 --no-default-features --features scan

      - name: Check WASM (decode-only + alloc)
        run: cargo check --target wasm32-wasip1 --no-default-features --features alloc

      - name: Check WASM (simd128, no threads)
        run: RUSTFLAGS="-C target-feature=+simd128" cargo check --target wasm32-wasip1 --no-default-features --features std,compress,simd,avx512

  wasm-execute:
    name: Execute WASM (${{ matrix.toolchain }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: stable, mode: normal }
          - { toolchain: 1.99.0, mode: normal }
          - { toolchain: nightly-2026-10-12, mode: shared }
          - { toolchain: nightly, mode: shared }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> tools/wasm-check/target
          key: wasm-${{ matrix.toolchain }}-${{ matrix.mode }}
      - name: Optimized library build and actual WASM execution
        run: bash scripts/test-wasm.sh '${{ matrix.toolchain }}' '${{ matrix.mode }}'

  # ==========================================================================
  # Clippy
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check


  # ==========================================================================
  # Benchmark compilation check
  # ==========================================================================
  bench-check:
    name: Bench compile (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: x64 }
          - { os: ubuntu-24.04-arm, name: aarch64 }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bench compile (default)
        run: cargo bench --no-run

      - name: Bench compile (unchecked)
        run: cargo bench --no-run --features unchecked

  # ==========================================================================
  # MSRV check
  # ==========================================================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --rust-version

  # ==========================================================================
  # Code coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
