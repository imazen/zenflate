name: Miri

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # `github.head_ref` is set ONLY on pull_request events, and this workflow
  # has no pull_request trigger at all — so the group always fell through to
  # `github.run_id` and `cancel-in-progress` was pure dead configuration.
  # `github.ref` is populated for both triggers here: `refs/tags/vN` on a tag
  # push (unique per tag, so release runs never cancel one another) and the
  # dispatched branch ref on workflow_dispatch (so a re-dispatch supersedes
  # the run it replaces, which is the point of re-dispatching).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (unsafe soundness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Miri tests (unchecked feature)
        run: |
          cargo miri test --features unchecked -- \
            --skip zeros --skip sequential --skip large \
            --skip all_levels --skip all_formats \
            --skip window_boundary --skip block_splitting \
            --skip parallel --skip compression_improves \
            --skip short_inputs --skip repetitive \
            --skip actually_compresses
