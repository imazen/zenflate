name: Miri

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (unsafe soundness)
    runs-on: ubuntu-latest
    # Bound the focused interpreter suite; broad codec workloads run natively.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Miri targets zenflate's unchecked pointer accesses. Native CI retains
      # the full safe/unchecked suites, C oracles, large inputs and conformance.
      # Disable SIMD here: CPU dispatch and intrinsics are checked by native
      # tier tests; these bounded interpreter tests exercise scalar memory access.
      - name: Bounded unchecked memory checks
        run: cargo miri test --no-default-features --features std,compress,unchecked --lib miri_tests:: -- --nocapture

      - name: Dynamic-header regression
        run: cargo miri test --no-default-features --features std,compress,unchecked --lib dynamic_header_with_every_precode_symbol_decodes
